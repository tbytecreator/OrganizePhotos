version: '3.8'

services:
  organize_photos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: organize_photos_web
    ports:
      - "8080:8080"
    volumes:
      # Mapeie os diretórios do host para o container
      # Utilize caminhos absolutos ou variáveis de ambiente para máxima flexibilidade
      - ${SOURCE_DIR:-./arquivos}:/app/arquivos
      - ${OUTPUT_DIR:-./organizados}:/app/organizados
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    networks:
      - organize_network

networks:
  organize_network:
    driver: bridge
