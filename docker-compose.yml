
services:
  organize_photos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: organize_photos_web
    ports:
      - "8080:8080"
    volumes:
      # Mapeie o home do usuário para permitir acesso ao sistema de arquivos do host
      - ${HOME}:${HOME}
      # Mapeie raízes do sistema para leitura (opcional, descomente se necessário)
      # - /media:/media:ro
      # - /mnt:/mnt:ro
      # Diretórios locais do container
      - ./static:/app/static:ro
    environment:
      - RUST_LOG=info
      - HOST_HOME=${HOME}
    restart: unless-stopped
    networks:
      - organize_network

networks:
  organize_network:
    driver: bridge
